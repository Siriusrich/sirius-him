  <circle cx="940" cy="628" r="230" fill="#f2b33d" opacity="0.35"/>
  <text x="90" y="330" font-family="Georgia, 'Times New Roman', serif" font-size="150" fill="#f1e9da" letter-spacing="2">Sirius HIM</text>
  <text x="96" y="410" font-family="Helvetica, Arial, sans-serif" font-size="40" fill="#f4713a" letter-spacing="6">MELODIC DANCEHALL &amp; R&amp;B</text>
  <text x="96" y="470" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#f1e9da" opacity="0.7" letter-spacing="4">RUNAWAY BAY, JAMAICA</text>
  <rect width="1200" height="628" filter="url(#oggrain)" opacity="0.5"/>
